<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Transgold Markets</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #0a0a0a;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
  }
  .box {
    width: 100%;
    max-width: 380px;
    text-align: center;
    padding: 40px 32px;
    border: 1px solid #1DB954;
    border-radius: 16px;
  }
  h2 { color: #1DB954; margin-top: 0; }
  p { color: #aaa; font-size: 14px; }
  input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border-radius: 8px;
    border: 1px solid #333;
    background: #151515;
    color: #fff;
    box-sizing: border-box;
    font-size: 15px;
  }
  button {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    border-radius: 8px;
    border: none;
    background: #1DB954;
    color: #0a0a0a;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .msg { margin-top: 16px; font-size: 14px; }
  .msg.error { color: #ff6b6b; }
  .msg.success { color: #6bffa0; }
</style>
</head>
<body>
  <div class="box">
    <h2>Reset Your Password</h2>
    <div id="formArea">
      <p>Enter a new password for your Transgold Markets account.</p>
      <input type="password" id="password" placeholder="New password" minlength="6">
      <input type="password" id="confirmPassword" placeholder="Confirm new password" minlength="6">
      <button id="submitBtn">Reset Password</button>
    </div>
    <div id="msg" class="msg"></div>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const msgEl = document.getElementById('msg');
  const formArea = document.getElementById('formArea');
  const submitBtn = document.getElementById('submitBtn');

  if (!token) {
    formArea.style.display = 'none';
    msgEl.textContent = 'This reset link is missing a token. Please request a new password reset from the app.';
    msgEl.className = 'msg error';
  }

  submitBtn.addEventListener('click', async () => {
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    msgEl.textContent = '';
    msgEl.className = 'msg';

    if (password.length < 6) {
      msgEl.textContent = 'Password must be at least 6 characters.';
      msgEl.className = 'msg error';
      return;
    }
    if (password !== confirmPassword) {
      msgEl.textContent = 'Passwords do not match.';
      msgEl.className = 'msg error';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Resetting...';

    try {
      const res = await fetch('reset_password.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password }),
      });
      const data = await res.json();

      if (res.ok && data.success) {
        formArea.style.display = 'none';
        msgEl.textContent = data.message;
        msgEl.className = 'msg success';
      } else {
        msgEl.textContent = data.error || 'Something went wrong. Please try again.';
        msgEl.className = 'msg error';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Reset Password';
      }
    } catch (e) {
      msgEl.textContent = 'Network error. Please check your connection and try again.';
      msgEl.className = 'msg error';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Reset Password';
    }
  });
</script>
</body>
</html>
